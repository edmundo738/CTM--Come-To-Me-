name: Godot tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "$GODOT_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          executable="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$executable"
          echo "GODOT=$executable" >> "$GITHUB_ENV"
      - name: Import, gameplay, progression and generation tests
        shell: bash
        run: tools/test-godot.sh
      - name: Install virtual display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Real-renderer readability and skill UI tests
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SKILL_RENDER_TEST_OUT: ${{ runner.temp }}/skill-ui-evidence
        run: xvfb-run -a -s "-screen 0 1280x720x24" tools/test-godot.sh --graphics
      - name: Save skill interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-ui-evidence
          path: ${{ runner.temp }}/skill-ui-evidence/*.png
          if-no-files-found: ignore
