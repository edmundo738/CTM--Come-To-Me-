name: Godot tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "$GODOT_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          executable="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$executable"
          echo "GODOT=$executable" >> "$GITHUB_ENV"
      - name: Import assets
        run: '"$GODOT" --headless --path . --editor --import'
      - name: Gameplay regression tests
        run: '"$GODOT" --headless --path . --script res://tests/self_test.gd'
      - name: Generation and bot smoke test
        run: |
          "$GODOT" --headless --path . --script res://tests/sweep.gd -- floors=1-10 seeds=2 bots=1
          "$GODOT" --headless --path . --script res://tests/sweep.gd -- floors=100-100 seeds=1 bots=0
          "$GODOT" --headless --path . --script res://tests/sweep.gd -- floors=200-200 seeds=1 bots=0
